name: Sync upstream (create PR)

on:
  schedule:
    - cron: '0 3 * * *' # UTC 每天 03:00 執行（可改）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/xiaolongbao0709/ai-virtual-phone.git || true
          git fetch upstream --tags

      - name: Create sync branch and merge upstream
        id: merge
        run: |
          BRANCH=sync/upstream-$(date -u +'%Y%m%d%H%M%S')
          git checkout -b "$BRANCH"
          # 嘗試合併 upstream/main 到新分支；遇到衝突會使 exit code != 0
          if git merge --no-edit upstream/main; then
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            # 中止合併並退出，讓 action 標記為需要人工處理
            git merge --abort || true
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Push sync branch
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin "refs/heads/${{ steps.merge.outputs.branch }}"

      - name: Create Pull Request
        if: steps.merge.outputs.merged == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): sync from upstream"
          branch: ${{ steps.merge.outputs.branch }}
          base: main
          title: "Sync from upstream"
          body: |
            This PR synchronizes changes from upstream repository xiaolongbao0709/ai-virtual-phone.
